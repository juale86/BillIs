<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BillIs: un ticket de papel sobre birome, con un gasto (rojo), un ingreso (verde) y el total. -->
  <rect width="512" height="512" fill="#2a46b8"/>
  <g transform="translate(256 256) scale(1.08) translate(-256 -253)">
  <!-- Sombra del ticket -->
  <path d="M164 118h204v262l-25.5 18-25.5-18-25.5 18-25.5-18-25.5 18-25.5-18-25.5 18-25.5-18z" fill="#1d2433" opacity="0.35" transform="translate(12 12)"/>
  <!-- Ticket con borde de corte en zigzag -->
  <path d="M152 106h208v266l-26 18-26-18-26 18-26-18-26 18-26-18-26 18-26-18z" fill="#f5f6f4"/>
  <!-- Encabezado -->
  <rect x="184" y="144" width="96" height="18" rx="9" fill="#1d2433"/>
  <!-- Gasto -->
  <rect x="184" y="196" width="72" height="14" rx="7" fill="#d5d9de"/>
  <rect x="276" y="192" width="52" height="22" rx="11" fill="#c0262d"/>
  <!-- Ingreso -->
  <rect x="184" y="238" width="56" height="14" rx="7" fill="#d5d9de"/>
  <rect x="276" y="234" width="52" height="22" rx="11" fill="#1d7a46"/>
  <!-- Total -->
  <rect x="184" y="290" width="144" height="6" rx="3" fill="#2a46b8"/>
  <rect x="244" y="314" width="84" height="26" rx="13" fill="#1d2433"/>
  </g>
</svg>
